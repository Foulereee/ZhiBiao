# 招投标行业预置数据源
# 配置参考 article-generation-skill 的 sources.yaml
# type: rss / api / crawl
# weight: 综合权重 (0-1),影响评分
# enabled: 是否启用,管理员可在 UI 修改
#
# ⚠️ 注意：已有源的 enabled 状态以【数据库】为准，YAML 只作为首次建库时的默认值。
#    在运行中的实例上启停数据源请用 PATCH /api/news/sources/{code} 或界面开关；
#    改 URL/type/weight 则会由启动同步覆盖到数据库。
#
# ─ 2026-09-17 订阅源探测结论 ──
# 下列源经"抓落地页解析 <link rel="alternate">"确认：站点可访问，但不提供任何
# RSS/Atom 订阅。无 RSS 就无法被当前抓取层消费（type=crawl 的 HTMLFetcher 目前是空实现），
# 故置 enabled=false，避免每次聚合都报"N 个源异常"。
#   ccgp_central / ccgp_local / ccgp_change  中国政府采购网（69KB 首页，无 RSS）
#   ggzy_national                            全国公共资源交易平台（67KB，无 RSS）
#   ggzy_sh / ggzy_gd                        上海 / 广东（站点为 JS 渲染）
#   ggzy_zj                                  域名 www.ggzy.zj.gov.cn DNS 不存在（配置错误）
#   ggzy_sd                                  旧域名 www.sdggzyjy.gov.cn DNS 不存在；
#                                            实际站点 ggzyjy.shandong.gov.cn 亦无 RSS
#   cebpubservice                            中国招标投标公共服务平台（163KB，无 RSS）
#   chinamobile                              b2b.10086.cn TLS 证书异常
#   chinaunicom                              中国联通（61KB，无 RSS）
#   xinzhiyuan                               新智元（55KB，无 RSS）
#   zhipuai_blog / baichuan_blog / stepfun_blog  官网为 SPA，无静态列表可抓
#   thebatch                                 DeepLearning.AI（187KB，feed 已下线）
# 如将来实现真正的 HTML 列表页抓取，可优先恢复：ccgp_*、ggzy_sd、ggzy_national、cebpubservice。

government_procurement:
  - name: "中国政府采购网-中央公告"
    code: "ccgp_central"
    type: "rss"
    url: "http://www.ccgp.gov.cn/cggg/dfgg/rss.xml"
    industry: "04"
    weight: 1.0
    enabled: false  # 站点无 RSS（实测 404）；如需启用请改用 HTML 列表页抓取
    description: "中央国家机关政府采购公告"
