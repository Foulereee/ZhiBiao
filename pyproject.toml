[project]
name = "bidmaster-pro"
version = "0.1.0"
description = "智标 - 全流程智能招投标平台（AGPL-3.0 衍生版）"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Foulereee", email = "1817558146@qq.com" }]
maintainers = [{ name = "Foulereee", email = "1817558146@qq.com" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiomysql>=0.2",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "litellm>=1.0",
    "openai>=1.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "chromadb>=0.5",
    "onnxruntime>=1.17",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "mammoth>=1.8",
    "chardet>=5.0",
    "beautifulsoup4>=4.12",
    # services/news/fetchers.py 直接 import，原先漏声明导致资讯中心抓取接口 500
    "feedparser>=6.0",
    "requests>=2.31",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "minio>=7.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "tenacity>=8.2",
    "loguru>=0.7",
    "jieba>=0.42",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "weasyprint>=61",
    "fastmcp>=2.0",
    "apprise>=1.8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "core*"]
exclude = ["tests*", "docs*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]
# 本地向量嵌入（BMP_EMBEDDING_MODE=local）时才需要，会引入 torch（约 800MB+）。
# 默认 EMBEDDING_MODE=api 无需安装，需要时可: pip install ".[local]"
local = [
    "sentence-transformers>=3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
