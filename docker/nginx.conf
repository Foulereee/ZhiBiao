# ============================================================================
# BidMaster Pro Web 前端 nginx 配置
# - 托管 Vite 构建出的静态资源
# - 反向代理 /api/* → api 服务（compose 服务名: api）
# - 反向代理 /docs /openapi.json → api 服务（可选，暴露 API 文档）
# ============================================================================

server {
    listen 80;
    server_name _;

    # 静态资源根目录
    root /usr/share/nginx/html;
    index index.html;

    # 上传文件大小限制（招标文件上传）
    client_max_body_size 100m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ─── 反向代理 API ───
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式生成支持：关闭缓冲，长连接超时放宽
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─── API 文档（可选，生产环境可注释掉）───
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── SPA 路由回退：所有未匹配路径返回 index.html ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的文件名可长期缓存）
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
