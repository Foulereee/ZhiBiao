<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="30%" stop-color="#1e3a5f"/>
      <stop offset="60%" stop-color="#1a365d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow effects -->
    <radialGradient id="glow1" cx="72%" cy="35%" r="35%" fx="72%" fy="35%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#1a56db" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="25%" cy="75%" r="28%" fx="25%" fy="75%">
      <stop offset="0%" stop-color="#1a56db" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="85%" cy="80%" r="20%" fx="85%" fy="80%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Line gradient -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.02"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a56db" stop-opacity="0.02"/>
      <stop offset="40%" stop-color="#1a56db" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a56db" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>

    <!-- Document icon symbol -->
    <symbol id="docIcon" viewBox="0 0 32 42">
      <rect x="1" y="1" width="30" height="40" rx="3" fill="none" stroke="#93c5fd" stroke-width="1"/>
      <line x1="7" y1="10" x2="25" y2="10" stroke="#93c5fd" stroke-width="0.8" opacity="0.8"/>
      <line x1="7" y1="16" x2="22" y2="16" stroke="#93c5fd" stroke-width="0.8" opacity="0.6"/>
      <line x1="7" y1="22" x2="24" y2="22" stroke="#93c5fd" stroke-width="0.8" opacity="0.5"/>
      <line x1="7" y1="28" x2="18" y2="28" stroke="#93c5fd" stroke-width="0.8" opacity="0.4"/>
      <line x1="7" y1="34" x2="20" y2="34" stroke="#93c5fd" stroke-width="0.8" opacity="0.3"/>
    </symbol>

    <!-- Hexagon symbol -->
    <symbol id="hexagon" viewBox="0 0 60 52">
      <polygon points="30,0 60,13 60,39 30,52 0,39 0,13" fill="none" stroke="#3b82f6" stroke-width="1"/>
    </symbol>

    <!-- Diamond symbol -->
    <symbol id="diamond" viewBox="0 0 30 30">
      <polygon points="15,0 30,15 15,30 0,15" fill="none" stroke="#3b82f6" stroke-width="0.8"/>
    </symbol>

    <!-- Pipeline arrow -->
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#3b82f6" opacity="0.3"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Glow overlays -->
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <rect width="1920" height="1080" fill="url(#glow3)"/>

  <!-- Grid - vertical lines -->
  <g stroke="#3b82f6" stroke-width="0.4" opacity="0.06">
    <line x1="96" y1="0" x2="96" y2="1080"/>
    <line x1="192" y1="0" x2="192" y2="1080"/>
    <line x1="288" y1="0" x2="288" y2="1080"/>
    <line x1="384" y1="0" x2="384" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="576" y1="0" x2="576" y2="1080"/>
    <line x1="672" y1="0" x2="672" y2="1080"/>
    <line x1="768" y1="0" x2="768" y2="1080"/>
    <line x1="864" y1="0" x2="864" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1056" y1="0" x2="1056" y2="1080"/>
    <line x1="1152" y1="0" x2="1152" y2="1080"/>
    <line x1="1248" y1="0" x2="1248" y2="1080"/>
    <line x1="1344" y1="0" x2="1344" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1536" y1="0" x2="1536" y2="1080"/>
    <line x1="1632" y1="0" x2="1632" y2="1080"/>
    <line x1="1728" y1="0" x2="1728" y2="1080"/>
    <line x1="1824" y1="0" x2="1824" y2="1080"/>
  </g>

  <!-- Grid - horizontal lines -->
  <g stroke="#3b82f6" stroke-width="0.4" opacity="0.06">
    <line x1="0" y1="90" x2="1920" y2="90"/>
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="450" x2="1920" y2="450"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="630" x2="1920" y2="630"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="0" y1="990" x2="1920" y2="990"/>
  </g>

  <!-- === MAIN VISUAL: Pipeline Flow (解读→生成→检查→输出) === -->

  <!-- Pipeline connection paths -->
  <path d="M 1100,200 C 1200,200 1250,300 1350,300 C 1450,300 1500,400 1600,400 C 1700,400 1750,500 1850,500"
        stroke="url(#lineGrad1)" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1050,400 C 1150,400 1200,500 1300,500 C 1400,500 1450,600 1550,600 C 1650,600 1700,700 1800,700"
        stroke="url(#lineGrad1)" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  <path d="M 1080,600 C 1180,600 1230,700 1330,700 C 1430,700 1480,800 1580,800"
        stroke="url(#lineGrad2)" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" opacity="0.5"/>
  <path d="M 1030,800 C 1130,800 1180,900 1280,900"
        stroke="url(#lineGrad2)" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Pipeline Step 1: 解读 (Interpret) -->
  <g transform="translate(1100, 200)">
    <circle r="28" fill="#1a56db" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.25"/>
    <circle r="12" fill="#3b82f6" fill-opacity="0.35" filter="url(#nodeGlow)"/>
    <circle r="4.5" fill="#93c5fd" fill-opacity="0.9"/>
    <text y="-42" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="system-ui, sans-serif" opacity="0.5" filter="url(#textGlow)">解读</text>
  </g>

  <!-- Pipeline Step 2: 生成 (Generate) -->
  <g transform="translate(1350, 300)">
    <circle r="28" fill="#1a56db" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.25"/>
    <circle r="12" fill="#3b82f6" fill-opacity="0.35" filter="url(#nodeGlow)"/>
    <circle r="4.5" fill="#93c5fd" fill-opacity="0.9"/>
    <text y="-42" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="system-ui, sans-serif" opacity="0.5" filter="url(#textGlow)">生成</text>
  </g>

  <!-- Pipeline Step 3: 检查 (Check) -->
  <g transform="translate(1600, 400)">
    <circle r="28" fill="#1a56db" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.25"/>
    <circle r="12" fill="#3b82f6" fill-opacity="0.35" filter="url(#nodeGlow)"/>
    <circle r="4.5" fill="#93c5fd" fill-opacity="0.9"/>
    <text y="-42" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="system-ui, sans-serif" opacity="0.5" filter="url(#textGlow)">检查</text>
  </g>

  <!-- Pipeline Step 4: 输出 (Output) -->
  <g transform="translate(1850, 500)">
    <circle r="28" fill="#1a56db" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.25"/>
    <circle r="12" fill="#3b82f6" fill-opacity="0.35" filter="url(#nodeGlow)"/>
    <circle r="4.5" fill="#93c5fd" fill-opacity="0.9"/>
    <text y="-42" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="system-ui, sans-serif" opacity="0.5" filter="url(#textGlow)">输出</text>
  </g>

  <!-- Secondary pipeline nodes -->
  <g transform="translate(1050, 400)">
    <circle r="20" fill="#1a56db" fill-opacity="0.08" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.15"/>
    <circle r="8" fill="#3b82f6" fill-opacity="0.25" filter="url(#nodeGlow)"/>
    <circle r="3" fill="#93c5fd" fill-opacity="0.7"/>
  </g>
  <g transform="translate(1300, 500)">
    <circle r="20" fill="#1a56db" fill-opacity="0.08" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.15"/>
    <circle r="8" fill="#3b82f6" fill-opacity="0.25" filter="url(#nodeGlow)"/>
    <circle r="3" fill="#93c5fd" fill-opacity="0.7"/>
  </g>
  <g transform="translate(1550, 600)">
    <circle r="20" fill="#1a56db" fill-opacity="0.08" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.15"/>
    <circle r="8" fill="#3b82f6" fill-opacity="0.25" filter="url(#nodeGlow)"/>
    <circle r="3" fill="#93c5fd" fill-opacity="0.7"/>
  </g>
  <g transform="translate(1800, 700)">
    <circle r="20" fill="#1a56db" fill-opacity="0.08" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.15"/>
    <circle r="8" fill="#3b82f6" fill-opacity="0.25" filter="url(#nodeGlow)"/>
    <circle r="3" fill="#93c5fd" fill-opacity="0.7"/>
  </g>

  <!-- Tertiary nodes (smaller) -->
  <g transform="translate(1080, 600)">
    <circle r="14" fill="#1a56db" fill-opacity="0.06" stroke="#3b82f6" stroke-width="0.6" stroke-opacity="0.1"/>
    <circle r="5" fill="#3b82f6" fill-opacity="0.2"/>
    <circle r="2" fill="#93c5fd" fill-opacity="0.6"/>
  </g>
  <g transform="translate(1330, 700)">
    <circle r="14" fill="#1a56db" fill-opacity="0.06" stroke="#3b82f6" stroke-width="0.6" stroke-opacity="0.1"/>
    <circle r="5" fill="#3b82f6" fill-opacity="0.2"/>
    <circle r="2" fill="#93c5fd" fill-opacity="0.6"/>
  </g>
  <g transform="translate(1580, 800)">
    <circle r="14" fill="#1a56db" fill-opacity="0.06" stroke="#3b82f6" stroke-width="0.6" stroke-opacity="0.1"/>
    <circle r="5" fill="#3b82f6" fill-opacity="0.2"/>
    <circle r="2" fill="#93c5fd" fill-opacity="0.6"/>
  </g>
  <g transform="translate(1030, 800)">
    <circle r="14" fill="#1a56db" fill-opacity="0.06" stroke="#3b82f6" stroke-width="0.6" stroke-opacity="0.1"/>
    <circle r="5" fill="#3b82f6" fill-opacity="0.2"/>
    <circle r="2" fill="#93c5fd" fill-opacity="0.6"/>
  </g>

  <!-- === Document Icons (scattered on right side) === -->
  <use href="#docIcon" x="1400" y="120" width="32" height="42" opacity="0.15"/>
  <use href="#docIcon" x="1550" y="200" width="28" height="36" opacity="0.10"/>
  <use href="#docIcon" x="1700" y="150" width="24" height="32" opacity="0.07"/>
  <use href="#docIcon" x="1620" y="550" width="26" height="34" opacity="0.08"/>
  <use href="#docIcon" x="1750" y="620" width="22" height="30" opacity="0.06"/>

  <!-- === Geometric Decorations === -->

  <!-- Hexagons -->
  <use href="#hexagon" x="1700" y="50" width="60" height="52" opacity="0.07"/>
  <use href="#hexagon" x="80" y="850" width="50" height="43" opacity="0.05"/>
  <use href="#hexagon" x="1500" y="900" width="40" height="35" opacity="0.04"/>

  <!-- Diamonds -->
  <use href="#diamond" x="1800" y="850" width="30" height="30" opacity="0.06"/>
  <use href="#diamond" x="200" y="150" width="25" height="25" opacity="0.04"/>
  <use href="#diamond" x="900" y="900" width="20" height="20" opacity="0.05"/>

  <!-- === Scattered Particles === -->
  <g fill="#93c5fd">
    <circle cx="150" cy="200" r="1.2" opacity="0.2"/>
    <circle cx="300" cy="350" r="1.5" opacity="0.15"/>
    <circle cx="100" cy="550" r="1" opacity="0.18"/>
    <circle cx="250" cy="750" r="1.3" opacity="0.12"/>
    <circle cx="400" cy="150" r="1.1" opacity="0.16"/>
    <circle cx="500" cy="850" r="1.4" opacity="0.14"/>
    <circle cx="350" cy="500" r="0.9" opacity="0.2"/>
    <circle cx="80" cy="400" r="1.2" opacity="0.15"/>
    <circle cx="750" cy="550" r="1.5" opacity="0.12"/>
    <circle cx="900" cy="750" r="1" opacity="0.18"/>
    <circle cx="1800" cy="250" r="1.3" opacity="0.15"/>
    <circle cx="1650" cy="880" r="1.1" opacity="0.13"/>
    <circle cx="1400" cy="450" r="1.4" opacity="0.1"/>
    <circle cx="1900" cy="600" r="1.2" opacity="0.16"/>
    <circle cx="600" cy="300" r="1" opacity="0.14"/>
    <circle cx="450" cy="700" r="1.3" opacity="0.12"/>
    <circle cx="700" cy="100" r="0.8" opacity="0.2"/>
    <circle cx="850" cy="950" r="1.1" opacity="0.1"/>
    <circle cx="1200" cy="150" r="1.2" opacity="0.08"/>
    <circle cx="1100" cy="950" r="1" opacity="0.1"/>
  </g>

  <!-- === Soft ambient glow circles (large, blurred) === -->
  <circle cx="1400" cy="300" r="120" fill="#3b82f6" opacity="0.03" filter="url(#softGlow)"/>
  <circle cx="1700" cy="500" r="80" fill="#1a56db" opacity="0.04" filter="url(#softGlow)"/>
  <circle cx="1200" cy="700" r="100" fill="#3b82f6" opacity="0.02" filter="url(#softGlow)"/>

  <!-- === Brand watermark (right side) === -->
  <text x="1750" y="540" fill="white" font-size="160" font-weight="800" font-family="system-ui, sans-serif"
        letter-spacing="-6" opacity="0.04" text-anchor="middle">BMP</text>

  <!-- === Left side decorative circuit pattern === -->
  <g stroke="#3b82f6" stroke-width="0.6" fill="none" opacity="0.08">
    <path d="M 50,400 L 150,400 L 150,450 L 250,450"/>
    <path d="M 50,500 L 120,500 L 120,550 L 200,550 L 200,600 L 300,600"/>
    <path d="M 80,650 L 180,650 L 180,700 L 280,700"/>
    <circle cx="150" cy="400" r="3" fill="#3b82f6"/>
    <circle cx="250" cy="450" r="3" fill="#3b82f6"/>
    <circle cx="120" cy="500" r="3" fill="#3b82f6"/>
    <circle cx="200" cy="550" r="3" fill="#3b82f6"/>
    <circle cx="300" cy="600" r="3" fill="#3b82f6"/>
    <circle cx="180" cy="650" r="3" fill="#3b82f6"/>
    <circle cx="280" cy="700" r="3" fill="#3b82f6"/>
  </g>

  <!-- === Bottom decorative wave === -->
  <path d="M 0,1050 Q 200,1020 400,1040 Q 600,1060 800,1035 Q 1000,1010 1200,1040 Q 1400,1070 1600,1045 Q 1800,1020 1920,1050 L 1920,1080 L 0,1080 Z"
        fill="#1a56db" opacity="0.04"/>
  <path d="M 0,1060 Q 300,1030 600,1050 Q 900,1070 1200,1045 Q 1500,1020 1920,1060 L 1920,1080 L 0,1080 Z"
        fill="#3b82f6" opacity="0.03"/>
</svg>
